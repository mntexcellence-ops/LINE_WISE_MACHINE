<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Machine Inventory — DEKKO ISHO Group</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#E9EEF4;--card:#FFFFFF;--border:#DCE4EE;--text:#16324F;--body:#33475C;--muted:#64748B;--faint:#94A3B8;--soft:#F7FAFC;--soft2:#EDF2F7;--shadow:#16324f0d;--brand:#006666;--brand-b:#0E8A8A;--pink:#EC268F}
[data-theme="dark"]{--bg:#0A1120;--card:#131E33;--border:#24365A;--text:#E8EEF9;--body:#C4D2E8;--muted:#93A5C4;--faint:#7186A8;--soft:#182740;--soft2:#1B2C4D;--shadow:#00000045;--brand:#0E8A8A;--brand-b:#14A3A3}
[data-theme="dark"] input{color-scheme:dark}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);padding:14px;transition:background .25s,color .25s}
.app{max-width:1460px;margin:0 auto}
.topbar{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px var(--shadow);margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logoimg{height:52px;width:auto;display:block}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.4px}
.brand h1 span{color:var(--brand-b)}
.brand p{font-size:11.5px;color:var(--muted)}
.live{font-size:11px;color:var(--muted);text-align:right}
.layout{display:grid;grid-template-columns:222px 1fr;gap:14px}
.side{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 10px var(--shadow);height:fit-content;position:sticky;top:14px}
.side h3{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text);border-bottom:2px solid var(--brand-b);padding-bottom:8px;margin-bottom:12px}
.fsec{margin-bottom:16px}
.fsec h4{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin-bottom:7px}
.fitem{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 2px;cursor:pointer;color:var(--body)}
.fitem input{accent-color:var(--brand-b);width:14px;height:14px}
.reset{font-size:11.5px;color:#118DFF;cursor:pointer;text-decoration:underline}
.dd{position:relative}
.ddbtn{width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer}
.ddpanel{margin-top:6px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--card);box-shadow:0 4px 14px var(--shadow)}
.ddtools{display:flex;gap:12px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px}
.ddtools span{font-size:11.5px;color:#118DFF;cursor:pointer;font-weight:600}
.dlabel{display:block;font-size:11px;color:var(--muted);margin:7px 0 3px}
.dinput{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--text);background:var(--soft);font-family:inherit}
.toolbtn{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:8px}
.toolbtn:hover{border-color:var(--brand-b)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px 8px;box-shadow:0 2px 10px var(--shadow);position:relative;min-width:0}
.kpi .ic{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600}
.kpi .v{font-size:clamp(14px,1.3vw,20px);font-weight:800;margin:5px 0 5px;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.chip.g{background:#DCF5E5;color:#15803D}.chip.r{background:#FDE3E3;color:#DC2626}.chip.n{background:var(--soft2);color:var(--muted)}
.chip.b{background:#DBEAFE;color:#1D4ED8}.chip.y{background:#FEF3C7;color:#B45309}
[data-theme="dark"] .chip.g{background:#123B25;color:#4ADE80}
[data-theme="dark"] .chip.r{background:#3D1A1A;color:#F87171}
[data-theme="dark"] .chip.b{background:#16294D;color:#7FB0FF}
[data-theme="dark"] .chip.y{background:#3A2E12;color:#FCD34D}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px var(--shadow);min-width:0;overflow-x:auto}
.card h3{font-size:13.5px;font-weight:700}
.card h3 i{font-style:normal;color:var(--brand-b);margin-right:6px}
.card .s{font-size:11px;color:var(--faint);margin:2px 0 10px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;padding:7px 8px;border-bottom:2px solid var(--border);background:var(--soft);position:sticky;top:0}
td{padding:7.5px 8px;border-bottom:1px solid var(--border);color:var(--body)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;color:var(--text);background:#EFFAF3;border-top:2px solid var(--brand-b)}
[data-theme="dark"] tr.tot td{background:#0E2A26}
.tblscroll{max-height:560px;overflow:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px}
.leg div{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
.nav div{background:var(--card);border:1px solid var(--border);border-radius:12px;text-align:center;padding:13px 6px;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--text);box-shadow:0 2px 10px var(--shadow)}
.nav div span{color:var(--brand-b);margin-right:7px}
.nav div.act{background:linear-gradient(135deg,#006666,#0E8A8A);color:#fff;border-color:#006666}
.nav div.act span{color:#fff}
.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:14px}
.kpi.click{cursor:pointer}
.kpi.click:hover{border-color:var(--brand-b)}
.cpmodal{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto}
.cphead{background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cphead h2{font-size:17px}
.cphead span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.cpbtn{padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer}
.cpbtn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.cpmsg{padding:10px 18px;font-size:13px;display:none}
.cpmsg.ok{color:#15803D;display:block}.cpmsg.err{color:#DC2626;display:block}
.cpset{background:var(--card);border-bottom:1px solid var(--border);padding:14px 18px;font-size:12.5px;color:var(--body)}
.cpset p{margin-bottom:10px;line-height:1.5}
.cpbody{padding:16px 18px}
.efgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.efgrid label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.efinput{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;color:var(--text);background:var(--soft);font-family:inherit}
@media print{
  body{background:#fff !important}
  body > *{display:none !important}
  body > .app{display:block !important}
  .app > *:not(#cpModal){display:none !important}
  #cpModal{display:block !important;position:static !important;overflow:visible !important;background:#fff !important}
  #cpModal .cphead{background:#fff !important}
  #cpModal .cphead .cpbtn, #cpModal #cpTabs, #cpModal .cpset, #cpModal #cpMsg, #cpModal #cpEditForm{display:none !important}
  #cpModal #cpTable, #cpModal #cpTable div{max-height:none !important;overflow:visible !important}
  #cpModal #cpChips .cpbtn{background:none !important;border:0 !important;padding:2px 4px !important;color:#000 !important}
  #cpModal th{background:#eee !important;color:#000 !important}
  #cpModal td, #cpModal h2{color:#000 !important}
  #cpModal #cpTotals{color:#333 !important}
  #cpModal #cpPrintFoot{display:block !important;font-size:11px;color:#666;margin-top:12px}
}
.view{display:none}
.view.on{display:block}
.nav div{cursor:pointer;user-select:none}
.nav div:hover{border-color:var(--brand-b)}
.insight{display:flex;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:var(--soft);margin-bottom:10px}
.insight .ii{font-size:20px;line-height:1.2}
.insight h4{font-size:13px;margin-bottom:2px;color:var(--text)}
.insight p{font-size:12px;color:var(--muted);line-height:1.5}
.insight b{color:var(--text)}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.s3,.s4,.s6,.s12{grid-column:span 12}}
@media(max-width:680px){body{padding:8px}.kpis{grid-template-columns:repeat(2,1fr);gap:9px}.nav{grid-template-columns:repeat(5,1fr);gap:9px}.topbar{flex-wrap:wrap;gap:10px;padding:12px 14px}.brand h1{font-size:16px}.logoimg{height:42px}.side{position:static}.card{padding:13px 12px}.kpi{padding:11px 12px 6px}}
@media(max-width:380px){.kpi .v{font-size:13px}.nav div{font-size:10.5px;padding:11px 3px}}

  : {grid:'#E6ECF3', mut:'#94A3B8', track:'#EDF2F7', ctr:'#16324F', hlab:'#33475C', nodata:'#94A3B8'}; }
function applyTheme(){ document.documentElement.dataset.theme = darkMode?'dark':'light';
  const b=document.getElementById('btnMode'); if(b) b.textContent = darkMode?T('light'):T('dark'); }
function toggleMode(){ darkMode=!darkMode;
  try{ localStorage.setItem('ud-theme', darkMode?'dark':'light'); }catch(e){}
  applyTheme(); render(); }
const selU = new Set(D.units);
const selT = new Set(D.rows.map(r=>r.sl));
function ddTypeLabel(){
  if(selT.size===D.rows.length) return T('allTypes');
  if(selT.size===0) return T('noTypes');
  return Tf('nTypes', {n: selT.size}); }
function buildTypeList(){
  const q=((document.getElementById('fTypeSearch')||{}).value||'').trim().toLowerCase();
  const el=document.getElementById('fTypes'); if(!el) return;
  el.innerHTML = D.rows.filter(r=>(!q || r.type.toLowerCase().includes(q))).map(r =>
    `<label class="fitem"><input type="checkbox" ${selT.has(r.sl)?'checked':''} onchange="togT('${r.sl}',this.checked)"> ${esc(r.sl)} · ${esc(r.type)}</label>`).join('');
}
function togT(sl,on){ on?selT.add(sl):selT.delete(sl);
  const b=document.getElementById('ddTypeBtn'); if(b) b.textContent=ddTypeLabel(); render(); }
let selLine = null, prevSelU = null;
function lineByIdx(i){ return (D.lineCols||[]).find(l=>l[0]===i); }
function buildLineOpts(){
  const s=document.getElementById('selLine'); if(!s) return;
  if(selLine!==null){ const ln=lineByIdx(selLine); if(!ln || !selU.has(ln[1])){ selLine=null; prevSelU=null; } }
  let html='<option value="">'+T('allLines')+'</option>';
  D.units.forEach(u=>{
    if(!selU.has(u)) return;
    const opts=(D.lineCols||[]).filter(l=>l[1]===u);
    if(!opts.length) return;
    html+=`<optgroup label="${u}">`+opts.map(l=>`<option value="${l[0]}" ${selLine===l[0]?'selected':''}>${esc(l[2])}</option>`).join('')+'</optgroup>';
  });
  s.innerHTML=html;
}
function setLine(v){
  if(!v){ selLine=null; if(prevSelU){ selU.clear(); prevSelU.forEach(u=>selU.add(u)); prevSelU=null; } buildFilters(); render(); return; }
  const ln=lineByIdx(parseInt(v,10)); if(!ln) return;
  prevSelU=new Set(selU); selLine=ln[0];
  selU.clear(); selU.add(ln[1]);
  buildFilters(); render();
}
const fmtN = v => { const r=Math.round(v*10)/10; return r.toLocaleString('en-US',{maximumFractionDigits:1}); };
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function buildFilters(){
  document.getElementById('fUnits').innerHTML = D.units.map(u =>
    `<label class="fitem"><input type="checkbox" ${selU.has(u)?'checked':''} onchange="togU('${u}',this.checked)"> ${u}</label>`).join('');
  buildLineOpts();
  buildTypeList();
}
function togU(u,on){ on?selU.add(u):selU.delete(u); buildLineOpts(); render(); }
function resetAll(){ D.units.forEach(u=>selU.add(u));
  selT.clear(); D.rows.forEach(r=>selT.add(r.sl));
  const q=document.getElementById('qSearch'); if(q) q.value='';
  const ft=document.getElementById('fTypeSearch'); if(ft) ft.value='';
  buildFilters(); render(); }
function toggleDD(which,ev){ ev.stopPropagation();
  const p=document.getElementById('dd'+which+'Panel');
  p.style.display = p.style.display==='none' ? 'block' : 'none'; }
function pickAll(kind,on){
  if(kind==='T'){ selT.clear(); if(on) D.rows.forEach(r=>selT.add(r.sl));
    buildTypeList();
    const b=document.getElementById('ddTypeBtn'); if(b) b.textContent=ddTypeLabel();
    render(); return; }
  selU.clear(); if(on) D.units.forEach(u=>selU.add(u));
  buildFilters(); render(); }
document.addEventListener('click', e=>{ if(!e.target.closest('.dd')){
  const p=document.getElementById('ddUnitPanel'); if(p) p.style.display='none';
  const t=document.getElementById('ddTypePanel'); if(t) t.style.display='none'; } });
function ddLabel(sel, all, noun){
  if(sel.size===all.length) return T('allUnits');
  if(sel.size===0) return T('noUnits');
  const arr=[...sel]; if(arr.length<=2) return arr.join(', ')+' ▾';
  return Tf('nUnits', {n: sel.size}); }
function agg(){
  const q=(document.getElementById('qSearch')||{}).value.trim().toLowerCase();
  const rows = D.rows.filter(r => selT.has(r.sl) && (!q || r.type.toLowerCase().includes(q))).map(r=>{
    let run=0, rent=0, idle=0, rentAmt=r.rentAmt;
    if(selLine!==null){ run = (r.ln && r.ln[selLine]) || 0; rentAmt=0; }
    else selU.forEach(u=>{ const v=r.u[u]||[0,0,0]; run+=v[0]; rent+=v[1]; idle+=v[2]; });
    return {sl:r.sl, type:r.type, rentAmt, run, rent, idle, tot: run+rent+idle};
  });
  let tr=0, te=0, ti=0;
  rows.forEach(r=>{ tr+=r.run; te+=r.rent; ti+=r.idle; });
  // per-unit totals, recomputed from the source rows:
  const byU2={};
  D.units.forEach(u=>{ byU2[u]={run:0, rent:0, idle:0, tot:0}; });
  D.rows.forEach(src=>{
    if(q && !src.type.toLowerCase().includes(q)) return;
    if(selLine!==null){ const ln=lineByIdx(selLine);
      if(ln && selU.has(ln[1])){ const v=(src.ln && src.ln[selLine]) || 0;
        byU2[ln[1]].run+=v; byU2[ln[1]].tot+=v; }
      return; }
    selU.forEach(u=>{ const v=src.u[u]||[0,0,0];
      byU2[u].run+=v[0]; byU2[u].rent+=v[1]; byU2[u].idle+=v[2]; byU2[u].tot+=v[0]+v[1]+v[2]; });
  });
  return {rows, tr, te, ti, tot: tr+te+ti, byUnit: byU2,
    nz: rows.filter(r=>r.tot>0).length};
}
function donutSVG(data, total){
  data=data.filter(d=>d[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!data.length||total<=0) return '<p style="color:'+thc().nodata+';font-size:12px">No data</p>';
  const cx=88,cy=88,r=76,ir=46; let a0=-90, paths='';
  data.forEach((d,i)=>{ const frac=d[1]/total, a1=a0+frac*360;
    const pt=(a,rr)=>[cx+rr*Math.cos(a*Math.PI/180), cy+rr*Math.sin(a*Math.PI/180)];
    const [x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r),[x2,y2]=pt(a1,ir),[x3,y3]=pt(a0,ir), lg=frac>0.5?1:0;
    if(frac>0.997) paths+=`<circle cx="${cx}" cy="${cy}" r="${(r+ir)/2}" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="${r-ir}"/>`;
    else paths+=`<path d="M${x0},${y0} A${r},${r} 0 ${lg} 1 ${x1},${y1} L${x2},${y2} A${ir},${ir} 0 ${lg} 0 ${x3},${y3} Z" fill="${PAL[i%PAL.length]}"><title>${esc(d[0])}: ${fmtN(d[1])}</title></path>`;
    a0=a1; });
  const leg=data.map((d,i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i>${esc(d[0])} · ${(d[1]/total*100).toFixed(1)}%</div>`).join('');
  return `<svg viewBox="0 0 176 176" width="100%" style="max-width:180px;display:block;margin:0 auto">${paths}<text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="13.5" font-weight="800" fill="${thc().ctr}">${fmtN(total)}</text></svg><div class="leg">${leg}</div>`;
}
function hbarSVG(data){
  data=data.filter(d=>d[1]>0).sort((a,b)=>b[1]-a[1]);
  if(!data.length) return '<p style="color:'+thc().nodata+';font-size:12px">No data</p>';
  const mx=Math.max(...data.map(d=>d[1]));
  return data.map((d,i)=>`<div style="display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:9px;margin:8px 0">
    <div style="font-size:12px;color:${thc().hlab};white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(d[0])}">${esc(d[0])}</div>
    <div style="background:${thc().track};border-radius:5px;height:15px"><div style="width:${Math.max(2,d[1]/mx*100)}%;height:15px;border-radius:5px;background:${PAL[i%PAL.length]}"></div></div>
    <div style="font-size:12px;text-align:right;color:${thc().ctr};font-weight:600;font-variant-numeric:tabular-nums">${fmtN(d[1])}</div></div>`).join('');
}
function dualBarHTML(rows){
  const d=rows.filter(r=>r.rent>0&&r.idle>0).sort((x,y)=>(y.rent+y.idle)-(x.rent+x.idle)).slice(0,10);
  if(!d.length) return '<p style="color:'+thc().nodata+';font-size:12px">'+T('dualNone')+'</p>';
  const mx=Math.max(...d.flatMap(r=>[r.rent,r.idle]));
  const bar=(label,val,color)=>`<div style="display:grid;grid-template-columns:64px 1fr 80px;align-items:center;gap:9px;margin:3px 0">
    <div style="font-size:11px;color:${thc().mut}">${label}</div>
    <div style="background:${thc().track};border-radius:5px;height:13px"><div style="width:${Math.max(2,val/mx*100)}%;height:13px;border-radius:5px;background:${color}"></div></div>
    <div style="font-size:12px;text-align:right;font-weight:600;color:${thc().ctr};font-variant-numeric:tabular-nums">${fmtN(val)}</div></div>`;
  return d.map(r=>`<div style="margin:12px 0 2px;font-size:12.5px;font-weight:700;color:${thc().ctr}">${esc(r.type)}</div>`
    + bar(T('dualRent'),r.rent,'#118DFF') + bar(T('dualIdle'),r.idle,'#EC268F')).join('');
}
function setHTML(id, html){ const e=document.getElementById(id); if(e) e.innerHTML=html; }

  setHTML('insights', ins.length? ins.map(x=>`<div class="insight"><div class="ii">${x.i}</div><div><h4>${x.h}</h4><p>${x.p}</p></div></div>`).join('') : '<p style="color:'+thc().nodata+';font-size:12px">'+T('insNothing')+'</p>');
  const top10=[...a.rows].sort((x,y)=>y.tot-x.tot).slice(0,10);

const SHEET_ID = '1QCBLrc-pt7D5UQSBQu_QmbRlRZYEtQ4I-Q5AiPMFFy0';
const UNITS_ALL = ['DGL-1','DRL','DFL','GGL','AFL','DGL-2'];
function parseCSV(t){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function pNum(v){ v=(v||'').toString().replace(/,/g,'').trim(); if(!v) return 0;
  const n=parseFloat(v); return isNaN(n)?0:n; }
function normH(h){ return String(h||'').toUpperCase().replace(/[\s.\-]/g,''); }
function detectCols(dh){
  const out={};
  UNITS_ALL.forEach(u=>{
    const un=normH(u);
    const rent=[], idle=[], run=[];
    dh.forEach((h,i)=>{
      if(h===un+',RENT' || h===un+',TRENT') rent.push(i);
      if(h===un+',IDLE') idle.push(i);
      if(h.startsWith(un+',') && (h.endsWith('TOTALRUNNING') || h.endsWith('TRUNNING'))) run.push(i);
    });
    if(rent.length && idle.length && run.length) out[u]=[rent[rent.length-1], idle[idle.length-1], run[run.length-1]];
  });
  const ra=dh.indexOf('RENTAMOUNT');
  return {cols: out, rentAmt: ra>=0?ra:-1};
}
function detectLineCols(rawH, cols){
  const dh=rawH.map(normH);
  const starts=[];
  UNITS_ALL.forEach(u=>{ const un=normH(u);
    const s=dh.findIndex(h=>h.startsWith(un+','));
    if(s>=0) starts.push([u,s]); });
  const grandCandidates=['GTOTALRENTMC','GTOTALIDLEMC','GTOTALRUNINGMC','ALLMACHINES','RENTPERDAY','RENTAMOUNT'];
  let grand=dh.length;
  dh.forEach((h,i)=>{ if(grandCandidates.includes(h) && i<grand) grand=i; });
  const out=[];
  starts.forEach(([u,s],k)=>{
    const e=(k+1<starts.length? starts[k+1][1]-1 : grand-1);
    const summ=new Set(cols[u]||[]);
    for(let i=s;i<=e;i++){
      if(summ.has(i) || dh[i].includes('DETAILS')) continue;
      const raw=rawH[i]||'';
      const label=raw.includes(',')? raw.split(',').slice(1).join(',').trim() : raw.trim();
      out.push([i,u,label]);
    }
  });
  return out;
}

  return parseCSV(await res.text()); }

  document.getElementById('cpTotals').textContent=scope+' · '+list.length+' '+T('cpTypes')+' · '+t[1]+' '+T('thTot')+' '+fmtN(mTot);
  setHTML('cpTable', list.length? `<div style="overflow:auto;max-height:70vh"><table><tr><th>${T('thSL')}</th><th>${T('thType')}</th><th class="num">${T('thRun')}</th><th class="num">${T('thRent')}</th><th class="num">${T('thIdle')}</th><th class="num">${T('thTot')}</th><th>${T('thEdit')}</th></tr>`+
    list.map(r=>`<tr><td>${esc(r.sl)}</td><td>${esc(r.type)}</td><td class="num">${fmtN(r.run)}</td><td class="num">${fmtN(r.rent)}</td><td class="num">${fmtN(r.idle)}</td><td class="num"><b>${fmtN(r.tot)}</b></td><td><button class="cpbtn" style="padding:4px 10px;font-size:12px" onclick="cpEditRow('${esc(r.sl)}')">✏️ ${T('thEdit')}</button></td></tr>`).join('')+'</table></div>':nodata);
}
function cpBuildEditLists(){
  const ts=document.getElementById('cpType');
  if(ts) ts.innerHTML=D.rows.map(r=>`<option value="${esc(r.sl)}">${esc(r.sl)} · ${esc(r.type)}</option>`).join('');
  const us=document.getElementById('cpUnit');
  if(us) us.innerHTML=D.units.map(u=>`<option>${u}</option>`).join('');
  cpBuildLineOpts(); cpTargetChange();
}
function cpBuildLineOpts(){
  const u=document.getElementById('cpUnit').value;
  const ls=document.getElementById('cpLine');
  if(ls) ls.innerHTML=(D.lineCols||[]).filter(l=>l[1]===u).map(l=>`<option value="${esc(l[2])}">${esc(l[2])}</option>`).join('');
}
function cpTargetChange(){
  const line=document.getElementById('cpTarget').value==='line';
  document.getElementById('cpFieldWrap').style.display=line?'none':'block';
  document.getElementById('cpLineWrap').style.display=line?'block':'none';
}
async function cpSave(){
  const url=cpGet('mc-entry-url');
  const token=document.getElementById('cpToken').value;
  const sl=document.getElementById('cpType').value;
  const type=(D.rows.find(r=>r.sl===sl)||{}).type||'';
  const unit=document.getElementById('cpUnit').value;
  const target=document.getElementById('cpTarget').value;
  const val=document.getElementById('cpVal').value;
  if(!sl){ cpSay(T('msgType'),'err'); return; }
  if(val===''||isNaN(parseFloat(val))){ cpSay(T('msgCount'),'err'); return; }
  if(!url){ cpSay(T('msgSetupUrl'),'err'); toggleCpSettings(); return; }
  if(!token){ cpSay(T('msgToken'),'err'); toggleCpSettings(); return; }
  if(document.getElementById('cpRemember').checked) cpSet('mc-entry-token',token);
  const q=new URLSearchParams({token, action:'edit', sl, type, unit, target,
    field:document.getElementById('cpField').value,
    line:document.getElementById('cpLine').value, value:val});
  const btn=document.getElementById('cpSaveBtn'); btn.disabled=true; cpSay(T('msgSaving'));
  try{
    const res=await fetch(url+'?'+q.toString()+'&cb='+Date.now());
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||'unknown error');
    cpSay(T('msgSaved'),'ok');
    await refreshLive(false);
    cpSetTab('list');
  }catch(e){ cpSay(Tf('msgSaveFail', {e: e.message}),'err'); }
  btn.disabled=false;
}
function cpEditRow(sl){
  const scope=cpUnit;
  cpSetTab('edit');
  const ts=document.getElementById('cpType'); if(ts) ts.value=sl;
  if(scope!=='all'){ const us=document.getElementById('cpUnit');
    if(us){ us.value=scope; cpBuildLineOpts(); } }
}
function cpPrint(){ cpSetTab('list');
  const oldT=document.title;
  const t=document.getElementById('cpTitle').textContent;
  document.title=t+' — '+(LANG==='bn'?'মেশিন ইনভেন্টরি':'Machine Inventory');
  const foot=document.getElementById('cpPrintFoot');
  if(foot) foot.textContent=Tf('cpFoot', {d: new Date().toLocaleString('en-GB')});
  const restore=()=>{ document.title=oldT; window.removeEventListener('afterprint',restore); };
  window.addEventListener('afterprint',restore);
  window.print();
}
buildFilters(); applyTheme(); applyLang(); render(); refreshLive(false);
renderHistCal();
(function(){ const d=new Date(); const ym=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  fetchHistMonth(ym).then(()=>fetchHistDay(todayISO())); })();
</script>
